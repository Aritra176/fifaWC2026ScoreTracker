<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FIFA World Cup 2026 — Live Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#07101f;--card:#0d1b2e;--border:#1a2d4a;
  --accent:#00d4ff;--gold:#ffd700;--live:#ff3b3b;--done:#00c853;
  --text:#ddeaf8;--muted:#4e6a8a;--dim:#1e3355;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes scorePop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}

/* ── HEADER ── */
#header{background:linear-gradient(160deg,#091828 0%,#07101f 100%);border-bottom:1px solid var(--border);padding:0 20px;position:sticky;top:0;z-index:100}
.hi{max-width:960px;margin:0 auto}
.ht{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:14px 0 0}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;color:#fff}
.logo em{color:var(--accent);font-style:normal}
.sub{font-size:11px;color:var(--muted);margin-top:2px}
.hb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.blv{background:#3b0000;border:1px solid var(--live);color:#ff7070;font-size:10px;font-weight:800;padding:4px 10px;border-radius:6px;animation:pulse 1.2s infinite;letter-spacing:1px;display:none;align-items:center;gap:4px}
.bdn{background:var(--dim);color:var(--muted);font-size:10px;padding:4px 10px;border-radius:6px}
.sync-bar{font-size:10px;color:#ffaa00;padding:3px 8px;border-radius:5px;background:#1a1000;border:1px solid #3a2a00;display:none;align-items:center;gap:5px}
.sync-spin{display:inline-block;animation:spin 1s linear infinite}
.tabs{display:flex;margin-top:10px}
.tb{padding:10px 16px;font-size:13px;font-family:'Barlow Condensed',sans-serif;font-weight:700;background:none;border:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:all .2s}
.tb.on{color:var(--accent);border-bottom:2px solid var(--accent)}
.tb:hover:not(.on){color:var(--text)}

/* ── BODY ── */
#body{max-width:960px;margin:0 auto;padding:16px}
.panel{display:none}.panel.on{display:block}

/* ── FILTERS ── */
.fs{margin-bottom:14px}
.fr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.fl{font-size:11px;color:var(--muted);font-weight:700;margin-right:2px;white-space:nowrap}
.fb{padding:4px 12px;font-size:11px;font-weight:700;border-radius:20px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);transition:all .15s;font-family:'Barlow Condensed',sans-serif}
.fb:hover{border-color:var(--accent);color:var(--text)}
.fb.on{border-color:var(--accent);background:#0d2a4a;color:var(--accent)}

/* ── DATE DIVIDER ── */
.dd{display:flex;align-items:center;gap:10px;margin:20px 0 10px}
.dd::before,.dd::after{content:'';flex:1;height:1px;background:var(--border)}
.dl{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;color:#fff;background:var(--card);border:1px solid var(--border);padding:4px 16px;border-radius:20px;white-space:nowrap}

/* ── MATCH CARD ── */
.mc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;animation:fadeIn .3s ease;transition:border-color .3s}
.mc.live{border-color:var(--live);box-shadow:0 0 16px rgba(255,59,59,.18)}
.mc.finished{border-color:#1e3a2a}
.br{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bg{font-size:10px;font-weight:800;padding:3px 8px;border-radius:5px;font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px}
.blive{background:#3b0000;color:#ff7070;animation:pulse 1.2s infinite}
.bfin{background:#0d2a1a;color:var(--done)}
.bup{background:var(--dim);color:var(--muted)}
.bround{background:#0d2a4a;color:var(--accent)}
.bmin{color:#ffaa00;font-size:12px;font-weight:800;font-family:'Barlow Condensed',sans-serif}
.bfetch{color:#ffaa00;font-size:10px;animation:pulse 1s infinite}

/* ── SCORE ROW ── */
.tr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ts{flex:1;min-width:0}
.ts.r{text-align:right}
.tf{font-size:18px;line-height:1;margin-bottom:3px}
.tn{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb{min-width:90px;text-align:center;font-family:'Barlow Condensed',sans-serif}
.sv{font-size:32px;font-weight:900;color:var(--accent);letter-spacing:3px;line-height:1;transition:transform .3s}
.sv.lv{color:#ff9f43}
.sv.pop{animation:scorePop .4s ease}
.svs{font-size:15px;color:var(--muted);font-weight:700;letter-spacing:2px}
.svsub{font-size:10px;color:var(--muted);margin-top:4px}

/* ── EVENTS ── */
.evt{background:#050f1c;border-radius:7px;padding:8px 12px;margin-bottom:9px;font-size:11px;color:#ffaa00;border-left:2px solid #3a2500}
.el{margin-bottom:2px}

/* ── META ── */
.mr{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.mi{font-size:11px;color:var(--muted)}

/* ── ACTIONS ── */
.ar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-size:11px;font-weight:700;padding:5px 11px;border-radius:7px;cursor:pointer;border:none;transition:all .15s;font-family:'Barlow Condensed',sans-serif}
.btn-in{background:#082030;border:1px solid #1a4060;color:#7ec8e3}
.btn-in:hover{background:#0d2a40}
.btn-ed{background:var(--dim);border:1px solid var(--border);color:var(--muted)}
.btn-ed:hover{background:#253a5a;color:var(--text)}
.btn-hl{background:#0d2a1a;border:1px solid var(--done);color:#69f0ae;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.btn-hl:hover{background:#123a22}
.btn-sv{background:var(--accent);border:none;color:#000;font-weight:900}
.btn-sv:hover{background:#33deff}
.btn-cn{background:var(--dim);border:1px solid var(--border);color:var(--muted)}
.fhl{font-size:11px;color:#ffaa00;padding:5px 0;animation:pulse 1.5s infinite}
.last-upd{font-size:10px;color:var(--muted);margin-left:auto}

/* ── GROUP TABLE ── */
.gg{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:14px}
.gb{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.gt{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-family:'Barlow Condensed',sans-serif}
.gtag{font-size:13px;font-weight:800;padding:3px 10px;border-radius:6px;border:1px solid}
.gtl{font-size:11px;color:var(--muted)}
table.st{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
table.st th{text-align:left;padding:5px 6px;color:var(--muted);font-weight:700;font-size:10px;border-bottom:1px solid var(--border);font-family:'Barlow Condensed',sans-serif}
table.st th:not(:nth-child(2)){text-align:center}
table.st td{padding:7px 6px;border-bottom:1px solid rgba(26,45,74,.3)}
table.st td:not(:nth-child(2)){text-align:center}
.rq{background:rgba(0,212,255,.05)}
.rt{background:rgba(255,215,0,.04)}
.ptb{font-weight:800;color:#fff}
.leg{font-size:10px;color:var(--muted);margin-bottom:10px}
.gms{border-top:1px solid var(--border);padding-top:10px}
.gmr{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:5px 0;border-bottom:1px solid rgba(26,45,74,.2)}
.gsc{font-weight:800;color:var(--accent);min-width:50px;text-align:center}
.gdt{color:var(--muted);min-width:50px;text-align:center}

/* ── MODAL ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;display:none}
.mb{background:#0d1b2e;border:1px solid var(--border);border-radius:16px;padding:22px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto;animation:fadeIn .2s ease}
.mh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.mt{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;color:var(--accent);margin-bottom:4px}
.mm{font-size:13px;color:var(--text)}
.mmeta{font-size:11px;color:var(--muted);margin-top:2px}
.mc-btn{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1;padding:0 0 0 10px}
.mc-btn:hover{color:var(--text)}
.al{text-align:center;padding:32px;color:var(--muted)}
.asp{font-size:30px;display:block;margin-bottom:10px;animation:spin 1.5s linear infinite}
.at{font-size:13px;line-height:1.75;color:#b8cce0;white-space:pre-wrap}
.eg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.el2{font-size:11px;color:var(--muted);margin-bottom:4px}
.ei{width:100%;background:#050f1c;border:1px solid var(--border);border-radius:8px;padding:8px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:900}
.es2{width:100%;background:#050f1c;border:1px solid var(--border);border-radius:8px;padding:8px;color:#fff;font-size:13px;margin-bottom:12px}
.ea{display:flex;gap:8px;margin-top:4px}
.note{background:#0a1a0a;border:1px solid #1a3a1a;border-radius:8px;padding:10px 12px;font-size:12px;color:#7ecf7e;margin-bottom:14px;line-height:1.6}
.emp{text-align:center;color:var(--muted);padding:40px;font-size:14px}

@media(max-width:600px){.logo{font-size:19px}.tb{padding:8px 11px;font-size:12px}.tn{font-size:14px}.sv{font-size:24px}.gg{grid-template-columns:1fr}}
</style>
</head>

function f(x){return FL[x]||"\u{1F3F3}";}
function eh(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function etIST(et){
  const p=et.trim().split(" ");
  const per=p[1]||"AM";
  const[hs,ms]=(p[0]||"0:00").split(":");
  let h=parseInt(hs),m=parseInt(ms||0);
  if(per==="PM"&&h!==12)h+=12;
  if(per==="AM"&&h===12)h=0;
  // ET (UTC-4) → IST (UTC+5:30) = +9h30m
  let ih=h+9,im=m+30;
  ih+=Math.floor(im/60);im=im%60;
  let nd=false;
  if(ih>=24){ih-=24;nd=true;}
  const s=ih>=12?"PM":"AM";
  const h12=ih%12===0?12:ih%12;
  return `${h12}:${String(im).padStart(2,"0")} ${s} IST${nd?" (+1 day)":""}`;
}

// Build a UTC kickoff Date object for a match
function kickoffUTC(m){
  try{
    const p=m.et.trim().split(" ");const per=p[1]||"AM";
    const[hs,ms]=(p[0]||"0:00").split(":");
    let h=parseInt(hs),mn=parseInt(ms||0);
    if(per==="PM"&&h!==12)h+=12;
    if(per==="AM"&&h===12)h=0;
    const dm={
      "Jun 11":new Date(2026,5,11),"Jun 12":new Date(2026,5,12),"Jun 13":new Date(2026,5,13),
      "Jun 14":new Date(2026,5,14),"Jun 15":new Date(2026,5,15),"Jun 16":new Date(2026,5,16),
      "Jun 17":new Date(2026,5,17),"Jun 18":new Date(2026,5,18),"Jun 19":new Date(2026,5,19),
      "Jun 20":new Date(2026,5,20),"Jun 21":new Date(2026,5,21),"Jun 22":new Date(2026,5,22),
      "Jun 23":new Date(2026,5,23),"Jun 24":new Date(2026,5,24),"Jun 25":new Date(2026,5,25),
      "Jun 26":new Date(2026,5,26),"Jun 27":new Date(2026,5,27),"Jun 28":new Date(2026,5,28),
      "Jun 29":new Date(2026,5,29),"Jun 30":new Date(2026,5,30),
      "Jul 1":new Date(2026,6,1),"Jul 2":new Date(2026,6,2),"Jul 3":new Date(2026,6,3),
      "Jul 4":new Date(2026,6,4),"Jul 5":new Date(2026,6,5),"Jul 6":new Date(2026,6,6),
      "Jul 7":new Date(2026,6,7),"Jul 9":new Date(2026,6,9),"Jul 10":new Date(2026,6,10),
      "Jul 11":new Date(2026,6,11),"Jul 14":new Date(2026,6,14),"Jul 15":new Date(2026,6,15),
      "Jul 18":new Date(2026,6,18),"Jul 19":new Date(2026,6,19)
    };
    const sd2=m.date.replace(/^[A-Za-z]+, /,"");
    const base=dm[sd2];if(!base)return null;
    const ko=new Date(base);ko.setUTCHours(h+4,mn,0,0); // ET = UTC-4
    return ko;
  }catch{return null;}
}

function autoStatus(m){
  const ko=kickoffUTC(m);if(!ko)return"upcoming";
  const diff=Date.now()-ko.getTime();
  if(diff<0)return"upcoming";
  if(diff<125*60000)return"live"; // 2h5m window for live (accounts for ET)
  return"finished";
}
function gSt(m){return gd(m.id).status||autoStatus(m);}

// AI API HELPER
// ═══════════════════════════════════════════
async function callAI(msgs,useSearch,jsonMode){
  const body={model:"claude-sonnet-4-20250514",max_tokens:jsonMode?500:950};
  if(useSearch)body.tools=[{type:"web_search_20250305",name:"web_search"}];
  body.system=jsonMode
    ?"You are a football data assistant. Reply ONLY with a valid JSON object. No markdown fences, no explanation, no extra text whatsoever. Just the raw JSON."
    :"You are a world-class football journalist covering FIFA World Cup 2026. Be specific, factual, and engaging.";
  body.messages=msgs;
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)
  });
  if(!r.ok)throw new Error("API "+r.status);
  const data=await r.json();
  return (data.content||[]).map(b=>b.text||"").filter(Boolean).join("\n");
}

function cleanJSON(raw){
  return raw.replace(/```json/gi,"").replace(/```/g,"").trim();
}

// ═══════════════════════════════════════════
// AUTO SCORE FETCHING — LIVE MATCHES
// ═══════════════════════════════════════════
async function fetchLiveScore(m){
  if(fetching.scores.has(m.id))return;
  fetching.scores.add(m.id);
  showSyncBar(true);
  try{
    const prompt=`Search the web right now for the live score of the FIFA World Cup 2026 match: ${m.home} vs ${m.away} (${m.date}). Return ONLY this JSON:
{"homeScore":N,"awayScore":N,"minute":N,"status":"live","events":["45' Goal - Mbappe (FRA)","67' Yellow - Müller (GER)"]}
If not found or not started yet, return {"homeScore":null,"awayScore":null,"minute":null,"status":"upcoming","events":[]}`;
    const raw=await callAI([{role:"user",content:prompt}],true,true);
    const p=JSON.parse(cleanJSON(raw));
    if(p.homeScore!==null&&p.homeScore!==undefined){
      const prev=gd(m.id);
      const changed=(prev.homeScore!==p.homeScore||prev.awayScore!==p.awayScore);
      sd(m.id,{
        homeScore:p.homeScore,awayScore:p.awayScore,
        liveMinute:p.minute,events:p.events||[],
        status:p.status||"live",
        lastFetched:Date.now(),scoreChanged:changed
      });
      rerender();
    }
  }catch(e){console.warn("live score fail:",e);}
  fetching.scores.delete(m.id);
  showSyncBar(false);
}

// ═══════════════════════════════════════════
// AUTO SCORE FETCHING — FINISHED MATCHES
// ═══════════════════════════════════════════
async function fetchFinalScore(m){
  if(fetching.scores.has(m.id))return;
  const d=gd(m.id);
  if(d.finalScoreFetched)return; // already confirmed final
  fetching.scores.add(m.id);
  showSyncBar(true);
  try{
    const prompt=`Search the web for the final score of FIFA World Cup 2026 match: ${m.home} vs ${m.away} (${m.date}). Return ONLY this JSON:
{"homeScore":N,"awayScore":N,"scorers":["45' Mbappe (FRA)","67' Müller (GER)"],"result":"Home team name won 2-1" }
If the match hasn't been played yet, return {"homeScore":null}`;
    const raw=await callAI([{role:"user",content:prompt}],true,true);
    const p=JSON.parse(cleanJSON(raw));
    if(p.homeScore!==null&&p.homeScore!==undefined){
      sd(m.id,{
        homeScore:p.homeScore,awayScore:p.awayScore,
        status:"finished",
        scorers:p.scorers||[],
        finalScoreFetched:true,
        lastFetched:Date.now()
      });
      rerender();
      // trigger highlight fetch after final score confirmed
      fetchHighlight(m);
    }
  }catch(e){console.warn("final score fail:",e);}
  fetching.scores.delete(m.id);
  showSyncBar(false);
}

// ═══════════════════════════════════════════
// AUTO HIGHLIGHT FETCHING
// ═══════════════════════════════════════════
async function fetchHighlight(m){
  if(!m.group&&!m.round)return;
  const d=gd(m.id);
  if(d.highlightUrl||fetching.highlights.has(m.id))return;
  fetching.highlights.add(m.id);
  rerender();
  try{
    const prompt=`Search the web for the best highlight video link for FIFA World Cup 2026 match: ${m.home} vs ${m.away} (${m.date}). Look for YouTube, FIFA official site, or major sports channel. Return ONLY this JSON:
{"url":"https://...","source":"YouTube","title":"Match highlights title"}
If not found, return {"url":null}`;
    const raw=await callAI([{role:"user",content:prompt}],true,true);
    const p=JSON.parse(cleanJSON(raw));
    if(p.url&&p.url.startsWith("http")){
      sd(m.id,{highlightUrl:p.url,highlightSource:p.source||"",highlightTitle:p.title||""});
      rerender();
    }
  }catch(e){console.warn("highlight fail:",e);}
  fetching.highlights.delete(m.id);
  rerender();
}

// ═══════════════════════════════════════════
// SMART SYNC — API calls only during live matches
// ═══════════════════════════════════════════
let liveTimer=null;

function syncLoop(){
  const now=Date.now();
  let anyLive=false;
  M.forEach(m=>{
    const st=gSt(m);
    const d=gd(m.id);
    if(st==="live"){
      anyLive=true;
      if(!d.lastFetched||now-d.lastFetched>55000) fetchLiveScore(m);
    } else if(st==="finished"){
      if(!d.finalScoreFetched&&!fetching.scores.has(m.id)) fetchFinalScore(m);
      if(d.homeScore!=null&&!d.highlightUrl&&!fetching.highlights.has(m.id)) fetchHighlight(m);
    }
  });
  // No live matches — stop the repeating timer and wait for next kickoff
  if(!anyLive&&liveTimer!==null){
    clearInterval(liveTimer);
    liveTimer=null;
    scheduleNextKickoff();
  }
}

function startLivePolling(){
  if(liveTimer!==null) return; // already running
  syncLoop();                   // immediate first tick
  liveTimer=setInterval(syncLoop,60000);
}

// One-shot wake-up: fires 5s after the next match kicks off
function scheduleNextKickoff(){
  const now=Date.now();
  let earliest=Infinity;
  M.forEach(m=>{
    if(gSt(m)!=="upcoming") return;
    const ko=kickoffUTC(m);
    if(ko&&ko.getTime()>now) earliest=Math.min(earliest,ko.getTime()-now);
  });
  if(earliest===Infinity) return;
  setTimeout(startLivePolling, earliest+5000);
}

// Sync bar visibility helper
let syncBarTimer=null;
function showSyncBar(show){
  const bar=document.getElementById("syncbar");
  if(show){bar.style.display="flex";clearTimeout(syncBarTimer);}
  else{syncBarTimer=setTimeout(()=>{bar.style.display="none";},3000);}
}

function fmtTime(ts){
  if(!ts)return"";
  const d=new Date(ts);
  const h=d.getHours(),m=d.getMinutes();
  const s=h>=12?"PM":"AM";const h12=h%12||12;
  return`${h12}:${String(m).padStart(2,"0")} ${s}`;
}

function rCard(m){
  const d=gd(m.id);
  const st=gSt(m);
  const hasScore=d.homeScore!=null&&d.awayScore!=null;
  const gc=m.group?GC[m.group]:"";

  else if(st==="finished")br+=`<span class="bg bfin">&#10003; FINAL</span>`;

  if(m.group)br+=`<span class="bg" style="background:${gc}22;color:${gc};border:1px solid ${gc}55">GROUP ${m.group}</span>`;
  if(rl)br+=`<span class="bg bround">${eh(rl)}${m.matchNo?` &middot; M${m.matchNo}`:""}</span>`;
  if(st==="live"&&d.liveMinute)br+=`<span class="bmin">${d.liveMinute}'</span>`;
  if(isFetching)br+=`<span class="bfetch">&#8635; updating&hellip;</span>`;

  // Score
  let scoreHtml="";
  if(hasScore){
    scoreHtml=`<div class="sv${st==="live"?" lv":""}">${d.homeScore}&ndash;${d.awayScore}</div>`;
    if(d.liveMinute&&st==="live")scoreHtml+=`<div class="svsub">${d.liveMinute}'</div>`;
    else if(st==="finished"&&d.lastFetched)scoreHtml+=`<div class="svsub">Full Time</div>`;
  } else {
    scoreHtml=`<div class="svs">VS</div><div class="svsub">${etIST(m.et)}</div>`;
  }

  // Events ticker (live goals/cards)
  let evHtml="";
  const evSrc=st==="live"?d.events:(d.scorers||[]);
  if(evSrc&&evSrc.length){
    evHtml=`<div class="evt">${evSrc.slice(-4).map(e=>`<div class="el">&#9917; ${eh(e)}</div>`).join("")}</div>`;
  }

  // Action buttons
  let ar="";
  if(st==="upcoming"||st==="live"){
    ar+=`<button class="btn btn-in" onclick="oAI('news',${m.id})">&#128240; Pre-match News</button>`;
    ar+=`<button class="btn btn-in" onclick="oAI('lineup',${m.id})">&#128203; Lineups</button>`;
  }
  if(st==="finished"){
    ar+=`<button class="btn btn-in" onclick="oAI('report',${m.id})">&#128221; Match Report</button>`;
    if(isHLFetching)ar+=`<span class="fhl">&#128269; Finding highlights&hellip;</span>`;
    else if(d.highlightUrl)ar+=`<a class="btn btn-hl" href="${eh(d.highlightUrl)}" target="_blank" rel="noopener">&#127909; Highlights${d.highlightSource?" ("+eh(d.highlightSource)+")":""}</a>`;
    else if(hasScore&&!d.finalScoreFetched)ar+=`<span class="fhl">&#128269; Verifying result&hellip;</span>`;
  }
  if(d.lastFetched)ar+=`<span class="last-upd">&#128337; ${fmtTime(d.lastFetched)}</span>`;

  return `<div class="mc ${st}" id="c${m.id}">
    <div class="br">${br}</div>
    <div class="tr">
      <div class="ts"><div class="tf">${f(m.home)}</div><div class="tn">${eh(m.home)}</div></div>
      <div class="sb">${scoreHtml}</div>
      <div class="ts r"><div class="tf" style="text-align:right">${f(m.away)}</div><div class="tn" style="text-align:right">${eh(m.away)}</div></div>
    </div>
    ${evHtml}
    <div class="mr">
      <span class="mi">&#128336; ${etIST(m.et)}</span>
      <span class="mi">&#127967; ${eh(m.stadium)}</span>
      <span class="mi">&#128205; ${eh(m.city)}</span>
    </div>
    <div class="ar">${ar}</div>
  </div>`;
}

function byDate(list){
  const mp={};
  list.forEach(m=>{(mp[m.date]=mp[m.date]||[]).push(m);});
  return mp;
}

function rSecs(list){
  const bd=byDate(list);
  const dates=Object.keys(bd);
  if(!dates.length)return`<div class="emp">No matches found.</div>`;
  return dates.map(date=>`<div class="dd"><span class="dl">&#128197; ${date}</span></div>${bd[date].map(rCard).join("")}`).join("");
}

// ═══════════════════════════════════════════
// TAB RENDERS
// ═══════════════════════════════════════════
function rFixtures(){
  const gm=M.filter(m=>!!m.group);
  const dates=[...new Set(gm.map(m=>m.date))];
  let fl=gm;
  if(gF!=="all")fl=fl.filter(m=>m.group===gF);
  if(dF!=="all")fl=fl.filter(m=>m.date===dF);
  const gbtn=["all","A","B","C","D","E","F","G","H","I","J","K","L"].map(g=>`<button class="fb${gF===g?" on":""}" onclick="sF('g','${g}')">${g==="all"?"All":g}</button>`).join("");
  const dbtn=["all",...dates].map(d2=>`<button class="fb${dF===d2?" on":""}" onclick="sF('d','${eh(d2)}')">${d2==="all"?"All":d2.replace(/^[A-Za-z]+, /,"")}</button>`).join("");
  return`<div class="fs">
    <div class="fr"><span class="fl">GROUP:</span>${gbtn}</div>
    <div class="fr"><span class="fl">DATE:</span>${dbtn}</div>
  </div>${rSecs(fl)}`;
}

function rKnockout(){
  const km=M.filter(m=>!!m.round);
  const dates=[...new Set(km.map(m=>m.date))];
  let fl=km;
  if(rF!=="all")fl=fl.filter(m=>m.round===rF);
  if(dF!=="all")fl=fl.filter(m=>m.date===dF);
  const rbtn=["all","R32","R16","QF","SF","TP","FIN"].map(r=>`<button class="fb${rF===r?" on":""}" onclick="sF('r','${r}')">${r==="all"?"All Rounds":RL[r]}</button>`).join("");
  const dbtn=["all",...dates].map(d2=>`<button class="fb${dF===d2?" on":""}" onclick="sF('d','${eh(d2)}')">${d2==="all"?"All":d2.replace(/^[A-Za-z]+, /,"")}</button>`).join("");
  return`<div class="fs">
    <div class="fr"><span class="fl">ROUND:</span>${rbtn}</div>
    <div class="fr"><span class="fl">DATE:</span>${dbtn}</div>
  </div>${rSecs(fl)}`;
}

function gStnd(g){
  const teams=GR[g].map(t=>({team:t,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0}));
  M.filter(m=>m.group===g).forEach(m=>{
    const d=gd(m.id);
    if(d.homeScore==null||d.awayScore==null)return;
    const hs=+d.homeScore,as=+d.awayScore;
    const hi=teams.findIndex(s=>s.team===m.home),ai=teams.findIndex(s=>s.team===m.away);
    if(hi<0||ai<0)return;
    teams[hi].P++;teams[ai].P++;
    teams[hi].GF+=hs;teams[hi].GA+=as;teams[ai].GF+=as;teams[ai].GA+=hs;
    teams[hi].GD=teams[hi].GF-teams[hi].GA;teams[ai].GD=teams[ai].GF-teams[ai].GA;
    if(hs>as){teams[hi].W++;teams[hi].Pts+=3;teams[ai].L++;}
    else if(hs<as){teams[ai].W++;teams[ai].Pts+=3;teams[hi].L++;}
    else{teams[hi].D++;teams[ai].D++;teams[hi].Pts++;teams[ai].Pts++;}
  });
  return teams.sort((a,b)=>b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF);
}

function rGroups(){
  return`<div class="gg">${Object.keys(GR).map(g=>{
    const gc=GC[g];const st=gStnd(g);
    const rows=st.map((s,i)=>{
      const rc=i<2?"rq":i===2?"rt":"";
      const rc2=i<2?"var(--accent)":i===2?"var(--gold)":"var(--muted)";
      const gdv=s.GD>0?"+"+s.GD:s.GD;
      return`<tr class="${rc}"><td><b style="color:${rc2}">${i+1}</b></td><td>${f(s.team)} ${eh(s.team)}</td><td>${s.P}</td><td>${s.W}</td><td>${s.D}</td><td>${s.L}</td><td>${gdv}</td><td class="ptb">${s.Pts}</td></tr>`;
    }).join("");
    const mrows=M.filter(m=>m.group===g).map(m=>{
      const d=gd(m.id);const hs=d.homeScore!=null;const st2=gSt(m);
      const sc=hs?`<span class="gsc${st2==="live"?' style="color:#ff9f43"':''}">${d.homeScore}&ndash;${d.awayScore}</span>`
                 :`<span class="gdt">${m.date.replace(/^[A-Za-z]+, /,"")}</span>`;
      return`<div class="gmr"><span>${f(m.home)} ${eh(m.home)}</span>${sc}<span>${eh(m.away)} ${f(m.away)}</span></div>`;
    }).join("");
    return`<div class="gb">
      <div class="gt"><span class="gtag" style="background:${gc}22;color:${gc};border-color:${gc}55">GROUP ${g}</span><span class="gtl">${GR[g].join(" &middot; ")}</span></div>
      <table class="st"><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="leg"><span style="color:var(--accent)">&#9632;</span> Qualify for R32 &nbsp;<span style="color:var(--gold)">&#9632;</span> Possible best 3rd</div>
      <div class="gms">${mrows}</div>
    </div>`;
  }).join("")}</div>`;
}

// ═══════════════════════════════════════════
// HEADER BADGES
// ═══════════════════════════════════════════
function updBadges(){
  let lv=0,dn=0;
  M.forEach(m=>{const s=gSt(m);if(s==="live")lv++;if(s==="finished")dn++;});
  document.getElementById("lcnt").textContent=lv;
  document.getElementById("dcnt").textContent=dn;
  const lb=document.getElementById("lbadge");
  lb.style.display=lv>0?"flex":"none";
}

// ═══════════════════════════════════════════
// MAIN RERENDER
// ═══════════════════════════════════════════
function rerender(){
  updBadges();
  if(aTab==="fixtures")document.getElementById("pf").innerHTML=rFixtures();
  else if(aTab==="groups")document.getElementById("pg").innerHTML=rGroups();
  else document.getElementById("pk").innerHTML=rKnockout();
}

function swTab(t){
  aTab=t;dF="all";gF="all";rF="all";
  document.querySelectorAll(".tb").forEach((b,i)=>b.classList.toggle("on",["fixtures","groups","knockout"][i]===t));
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("on"));
  document.getElementById(t==="fixtures"?"pf":t==="groups"?"pg":"pk").classList.add("on");
  rerender();
}

function sF(type,val){
  if(type==="d")dF=val;else if(type==="g")gF=val;else if(type==="r")rF=val;
  rerender();
}

// ═══════════════════════════════════════════
// AI MODAL (News / Lineups / Report)
// ═══════════════════════════════════════════
async function oAI(type,id){
  const m=M.find(x=>x.id===id);if(!m)return;
  const titles={news:"&#128240; Pre-match News",lineup:"&#128203; Expected Lineups",report:"&#128221; Match Report"};
  document.getElementById("mtitle").innerHTML=titles[type];
  document.getElementById("mmatch").textContent=`${f(m.home)} ${m.home} vs ${m.away} ${f(m.away)}`;
  document.getElementById("mmeta").textContent=`${m.date} \u00b7 ${etIST(m.et)} \u00b7 ${m.stadium}, ${m.city}`;
  document.getElementById("mbody").innerHTML=`<div class="al"><span class="asp">&#9917;</span>Loading AI analysis&hellip;</div>`;
  document.getElementById("modal").style.display="flex";
  const prs={
    news:`Pre-match analysis for ${m.home} vs ${m.away} at FIFA World Cup 2026${m.group?" (Group "+m.group+")":""}, ${m.date} at ${m.stadium}. Cover recent form, head-to-head, key players to watch, injury news. 3-4 paragraphs.`,
    lineup:`Expected starting lineups for ${m.home} vs ${m.away} at FIFA World Cup 2026. Show formation and 11 players for each team based on latest squad news and confirmed selections.`,
    report:`Detailed match report for ${m.home} vs ${m.away} at FIFA World Cup 2026, ${m.date}. Search the web for the actual result. Cover: final score, goal scorers, key moments, standout player, tactical analysis. 3 paragraphs.`
  };
  try{
    const txt=await callAI([{role:"user",content:prs[type]}],type==="report",false);
    document.getElementById("mbody").innerHTML=`<div class="at">${eh(txt)}</div>`;
  }catch{
    document.getElementById("mbody").innerHTML=`<div class="at" style="color:#ff7070">Failed to load. Please check your connection and try again.</div>`;
  }
}

function cModal(e){
  if(e&&e.target!==document.getElementById("modal"))return;
  document.getElementById("modal").style.display="none";
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
rerender();

// If a match is already live when page loads, start polling immediately
if(M.some(m=>autoStatus(m)==="live")){
  startLivePolling();
} else {
  // Handle one-shot tasks for any already-finished matches (final scores + highlights)
  syncLoop();
  // Schedule polling to start at the next upcoming kickoff
  scheduleNextKickoff();
}

// Only update the live/done badge counters in the header — no page rebuild, no flash
setInterval(updBadges, 30000);
</script>
